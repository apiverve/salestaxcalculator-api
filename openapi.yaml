openapi: 3.0.4
info:
  title: Sales Tax Calculator
  description: >-
    Sales Tax Calculator is a US sales tax calculation API: send an order amount
    with a ZIP code or state and get the combined rate, the tax amount and the
    order total back as JSON. Paid plans split both the rate and the tax amount
    by state, county, city and special district.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/salestaxcalculator:
    get:
      summary: Sales Tax Calculator
      description: Calculate sales tax for a purchase amount at a specific US location
      operationId: salestaxcalculator
      parameters:
        - name: amount
          in: query
          schema:
            type: number
          required: true
          description: Purchase amount to calculate tax on
          example: 100
        - name: zip
          in: query
          schema:
            type: string
          required: false
          description: Valid US 5-digit ZIP code (required unless state is given)
          example: '90210'
        - name: state
          in: query
          schema:
            type: string
          required: false
          description: >-
            2-letter US state code (e.g., CA, NY, TX); used when zip is not
            given, state rate only
          example: CA
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  amount: 100
                  taxRate: 0.1025
                  taxRatePercent: 10.25
                  taxAmount: 10.25
                  totalAmount: 110.25
                  zip: '90210'
                  state: CA
                  region: WEST HOLLYWOOD TOURISM IMPROVEMENT DISTRICT
                  breakdown:
                    stateRate: 0.06
                    countyRate: 0.0025
                    cityRate: 0.0075
                    specialRate: 0.0325
                    stateTax: 6
                    countyTax: 0.25
                    cityTax: 0.75
                    specialTax: 3.25
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  amount: 100
  zip: '90210'
